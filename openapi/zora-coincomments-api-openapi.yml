      operationId: GetCoinComments
      parameters:
      - name: address
        in: query
        schema:
          type: string
          nullable: false
        required: true
      - name: chain
        in: query
        schema:
          type: integer
          nullable: true
          default: 8453
        required: false
      - name: after
        in: query
        schema:
          type: string
          nullable: true
        required: false
      - name: count
        in: query
        schema:
          type: integer
          nullable: true
          default: 10
        required: false
      summary: zoraSDK_coinComments query
      tags:
